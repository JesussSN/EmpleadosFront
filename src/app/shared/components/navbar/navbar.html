<header class="topbar">
    <div class="topbar__left">
        <div class="brand-pill">
            <span class="brand-pill__icon">⚡</span>
            <span>Sistema</span>
        </div>

        <nav class="nav-menu" aria-label="Navegación principal">
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item">
                <span>🏠</span>
                Dashboard
            </a>
            <a routerLink="/empleados" routerLinkActive="active" class="nav-item">
                <span>👥</span>
                Empleados
            </a>
            <a routerLink="/empleados/nuevo" routerLinkActive="active" class="nav-item">
                <span>➕</span>
                Nuevo
            </a>
            <a routerLink="/estadisticas" routerLinkActive="active" class="nav-item">
                <span>📊</span>
                Estadísticas
            </a>
        </nav>
    </div>

    <div class="topbar__right">
        <div class="search-box">
            <span class="search-box__icon">⌕</span>
            <input type="text" placeholder="Buscar empleado..." aria-label="Buscar empleado" />
        </div>

        <button class="icon-button" aria-label="Notificaciones">
            <span>🔔</span>
            <span class="badge">3</span>
        </button>

        <div class="user-card">
            <div class="avatar">J</div>
            <div class="user-card__info">
                <strong>Jesús</strong>
                <small>Administrador</small>
            </div>
        </div>
    </div>
</header>
