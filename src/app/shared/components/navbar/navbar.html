<header class="topbar">
    <div class="topbar__left">
        <div class="brand-pill">
            <span class="brand-pill__icon">⚡</span>
            <span>Sistema</span>
        </div>

        <nav class="nav-menu" aria-label="Navegación principal">
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item">
                <span>🏠</span>
                <span>Dashboard</span>
            </a>
            <a routerLink="/empleados" routerLinkActive="active" class="nav-item">
                <span>👥</span>
                <span>Empleados</span>
            </a>
            <a routerLink="/empleados/nuevo" routerLinkActive="active" class="nav-item">
                <span>➕</span>
                <span>Nuevo</span>
            </a>
            <a routerLink="/puestos" routerLinkActive="active" class="nav-item">
                <span>🧩</span>
                <span>Puestos</span>
            </a>
            <a routerLink="/estadisticas" routerLinkActive="active" class="nav-item">
                <span>📊</span>
                <span>Estadísticas</span>
            </a>
        </nav>
    </div>

    <div class="topbar__right">
        <button class="icon-button" aria-label="Notificaciones">
            <span>🔔</span>
            <span class="badge">3</span>
        </button>

        <div class="user-card">
            <div class="avatar">J</div>
            <div class="user-card__info">
                <strong>Jesús</strong>
                <small>Admin</small>
            </div>
        </div>
    </div>
</header>
