<div class="min-h-screen bg-gray-100 p-8">

  <div class="bg-white rounded-xl shadow-md p-6 mb-6">
    <h1 class="text-3xl font-bold text-slate-700">Administración de puestos</h1>
    <p class="text-gray-500 mt-2">Gestiona los puestos disponibles para asignarlos a los empleados.</p>
  </div>

  <div class="bg-white rounded-xl shadow-md p-6 mb-6">
    <div class="flex flex-col md:flex-row gap-4 items-center">
      <input
        type="text"
        [(ngModel)]="nuevoPuesto"
        placeholder="Agregar nuevo puesto"
        class="border border-gray-300 rounded-lg px-4 py-3 w-full md:w-96 focus:outline-none focus:ring-2 focus:ring-red-600"
      />

      <button
        type="button"
        (click)="guardarPuesto()"
        class="px-6 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700 font-semibold">
        Guardar puesto
      </button>
    </div>
  </div>

  <div class="bg-white rounded-xl shadow-md p-6">
    <h2 class="text-xl font-bold text-slate-700 mb-4">Listado de puestos</h2>

    @if (cargando) {
      <p class="text-slate-500">Cargando puestos...</p>
    } @else if (puestos.length === 0) {
      <p class="text-slate-500">No hay puestos registrados.</p>
    } @else {
      <div class="space-y-3">
        @for (puesto of puestos; track puesto.id) {
          <div class="flex items-center justify-between border border-slate-200 rounded-lg p-4">
            <span class="font-semibold text-slate-700">{{ puesto.nombre }}</span>

            <button
              type="button"
              (click)="eliminarPuesto(puesto.id)"
              class="px-4 py-2 rounded-lg border border-red-500 text-red-600 hover:bg-red-50 font-medium">
              Eliminar
            </button>
          </div>
        }
      </div>
    }
  </div>

</div>
