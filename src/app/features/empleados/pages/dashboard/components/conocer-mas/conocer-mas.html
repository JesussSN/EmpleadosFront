@if (visible) {
  <div class="mt-6 rounded-2xl border border-slate-200 bg-slate-50 p-6 shadow-sm">
    <div class="flex items-start justify-between gap-4">
      <div>
        <h3 class="text-2xl font-semibold text-slate-800">{{ contenido.titulo }}</h3>
        <p class="mt-2 text-slate-600">
          {{ contenido.descripcion }}
        </p>
      </div>
      <button
        type="button"
        (click)="cerrar()"
        class="rounded-full border border-slate-300 px-3 py-1 text-sm font-medium text-slate-600 hover:bg-slate-200"
      >
        Cerrar
      </button>
    </div>

    <div class="mt-6 grid gap-4 md:grid-cols-3">
      @for (tarjeta of contenido.tarjetas; track tarjeta.titulo) {
        <div class="rounded-xl bg-white p-4 shadow-sm">
          <h4 class="font-semibold text-slate-800">{{ tarjeta.titulo }}</h4>
          <p class="mt-2 text-sm text-slate-600">{{ tarjeta.texto }}</p>
        </div>
      }
    </div>
  </div>
}
